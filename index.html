<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ACTIVE SUREPLUG - Future of Video Editing</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100;200;300;400;500;600&display=swap" rel="stylesheet">
  <style>
    * {
      font-family: 'Inter', sans-serif;
      font-weight: 200;
      letter-spacing: 0.05em;
    }
    
    body {
      background: linear-gradient(135deg, #0a0a1a 0%, #0f0f2e 50%, #1a1a3e 100%);
    }

    .glass-effect {
      background: rgba(15, 15, 46, 0.6);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(59, 130, 246, 0.1);
    }

    .glow-text {
      text-shadow: 0 0 30px rgba(59, 130, 246, 0.3), 0 0 60px rgba(59, 130, 246, 0.1);
    }

    .neon-border {
      box-shadow: 0 0 20px rgba(59, 130, 246, 0.2), inset 0 0 20px rgba(59, 130, 246, 0.05);
    }

    .timeline-dot {
      background: radial-gradient(circle, rgba(59, 130, 246, 1) 0%, rgba(59, 130, 246, 0) 70%);
    }

    .floating {
      animation: float 6s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-20px); }
    }

    .glitch-effect {
      animation: glitch 5s infinite;
    }

    @keyframes glitch {
      0%, 100% { transform: translate(0); }
      20% { transform: translate(-2px, 2px); }
      40% { transform: translate(-2px, -2px); }
      60% { transform: translate(2px, 2px); }
      80% { transform: translate(2px, -2px); }
    }

    .grid-pattern {
      background-image: 
        linear-gradient(rgba(59, 130, 246, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(59, 130, 246, 0.03) 1px, transparent 1px);
      background-size: 50px 50px;
    }
  </style>
</head>
<body class="grid-pattern min-h-screen text-gray-100">
  <div id="app"></div>

  <script type="module">
    // TypeScript-like code with type annotations in comments
    interface NavItem {
      label: string;
      href: string;
      active?: boolean;
    }

    interface Feature {
      icon: string;
      title: string;
      description: string;
      gradient: string;
    }

    interface Timeline {
      frame: string;
      effect: string;
      duration: string;
    }

    interface Project {
      title: string;
      type: string;
      color: string;
    }

    // Main App Component
    class App {
      private container: HTMLElement | null;
      
      constructor() {
        this.container = document.getElementById('app');
        this.init();
      }

      private init(): void {
        if (!this.container) return;
        
        this.container.innerHTML = `
          ${Navbar.render()}
          ${Hero.render()}
          ${Features.render()}
          ${TimelineEditor.render()}
          ${Projects.render()}
          ${Footer.render()}
        `;
        
        this.initializeAnimations();
        this.initializeIntersectionObserver();
      }

      private initializeAnimations(): void {
        // Smooth scroll for navigation
        document.querySelectorAll('a[href^="#"]').forEach(anchor => {
          anchor.addEventListener('click', (e) => {
            e.preventDefault();
            const target = document.querySelector(anchor.getAttribute('href') || '');
            if (target) {
              target.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }
          });
        });
      }

      private initializeIntersectionObserver(): void {
        const observer = new IntersectionObserver((entries) => {
          entries.forEach(entry => {
            if (entry.isIntersecting) {
              entry.target.classList.add('opacity-100', 'translate-y-0');
              entry.target.classList.remove('opacity-0', 'translate-y-10');
            }
          });
        }, { threshold: 0.1 });

        document.querySelectorAll('.animate-on-scroll').forEach(el => {
          observer.observe(el);
        });
      }
    }

    // Navbar Component
    class Navbar {
      static render(): string {
        const navItems: NavItem[] = [
          { label: 'Home', href: '#home', active: true },
          { label: 'Editor', href: '#editor' },
          { label: 'Features', href: '#features' },
          { label: 'Projects', href: '#projects' },
        ];

        return `
          <nav class="fixed top-0 w-full z-50 glass-effect">
            <div class="max-w-7xl mx-auto px-6 py-4">
              <div class="flex items-center justify-between">
                <div class="flex items-center space-x-2 glitch-effect">
                  <div class="w-8 h-8 bg-gradient-to-r from-blue-500 to-blue-700 rounded-lg transform rotate-45"></div>
                  <span class="text-2xl font-thin tracking-widest glow-text">
                    ACTIVE <span class="text-blue-400">SUREPLUG</span>
                  </span>
                </div>
                <div class="hidden md:flex space-x-8">
                  ${navItems.map(item => `
                    <a href="${item.href}" 
                       class="text-sm uppercase tracking-widest hover:text-blue-400 transition-all duration-300 
                              ${item.active ? 'text-blue-400' : 'text-gray-400'}"
                       style="font-weight: 300;">
                      ${item.label}
                    </a>
                  `).join('')}
                </div>
                <button class="glass-effect px-6 py-2 rounded-full text-sm uppercase tracking-widest hover:bg-blue-600 transition-all duration-300 neon-border"
                        style="font-weight: 300;">
                  START EDITING
                </button>
              </div>
            </div>
          </nav>
        `;
      }
    }

    // Hero Component
    class Hero {
      static render(): string {
        return `
          <section id="home" class="min-h-screen flex items-center justify-center relative overflow-hidden pt-20">
            <div class="absolute inset-0">
              <div class="absolute top-1/4 left-1/4 w-96 h-96 bg-blue-500/10 rounded-full blur-3xl floating"></div>
              <div class="absolute bottom-1/4 right-1/4 w-96 h-96 bg-blue-700/10 rounded-full blur-3xl floating" style="animation-delay: -3s;"></div>
            </div>
            
            <div class="max-w-7xl mx-auto px-6 text-center relative z-10">
              <div class="animate-on-scroll opacity-0 translate-y-10 transition-all duration-1000">
                <h1 class="text-8xl md:text-9xl font-thin tracking-tighter mb-8 glow-text" style="font-weight: 100;">
                  <span class="block">ACTIVE</span>
                  <span class="block text-blue-400">SUREPLUG</span>
                </h1>
                
                <p class="text-2xl md:text-3xl font-extralight text-gray-400 mb-12 tracking-wide" style="font-weight: 200;">
                  THE FUTURE OF <span class="text-blue-300">VIDEO EDITING</span>
                </p>
                
                <div class="flex flex-col md:flex-row gap-6 justify-center">
                  <button class="glass-effect px-12 py-4 rounded-full text-lg uppercase tracking-widest hover:bg-blue-600 transition-all duration-300 transform hover:scale-105 neon-border"
                          style="font-weight: 300;">
                    DOWNLOAD NOW
                  </button>
                  <button class="px-12 py-4 rounded-full text-lg uppercase tracking-widest border border-blue-500/30 hover:border-blue-500 transition-all duration-300"
                          style="font-weight: 300;">
                    WATCH DEMO
                  </button>
                </div>
                
                <div class="mt-20">
                  <div class="glass-effect rounded-2xl p-8 neon-border">
                    <div class="flex items-center justify-center space-x-4 text-sm text-gray-400">
                      <span class="text-blue-400">4K</span>
                      <span>•</span>
                      <span class="text-blue-400">60FPS</span>
                      <span>•</span>
                      <span class="text-blue-400">HDR</span>
                      <span>•</span>
                      <span class="text-blue-400">AI-POWERED</span>
                      <span>•</span>
                      <span class="text-blue-400">CLOUD SYNC</span>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </section>
        `;
      }
    }

    // Features Component
    class Features {
      static render(): string {
        const features: Feature[] = [
          {
            icon: '◆',
            title: 'AI MOTION TRACKING',
            description: 'Advanced neural networks track subjects with pixel-perfect precision in real-time.',
            gradient: 'from-blue-500 to-blue-600'
          },
          {
            icon: '◇',
            title: 'QUANTUM RENDERING',
            description: 'Lightning-fast rendering engine processes 8K footage in milliseconds.',
            gradient: 'from-blue-600 to-blue-700'
          },
          {
            icon: '◈',
            title: 'HOLOGRAPHIC TIMELINE',
            description: '3D timeline visualization for intuitive editing workflow.',
            gradient: 'from-blue-700 to-blue-800'
          }
        ];

        return `
          <section id="features" class="py-32 px-6">
            <div class="max-w-7xl mx-auto">
              <h2 class="text-5xl font-thin text-center mb-20" style="font-weight: 100;">
                NEXT GEN <span class="text-blue-400">FEATURES</span>
              </h2>
              
              <div class="grid md:grid-cols-3 gap-12">
                ${features.map((feature, index) => `
                  <div class="animate-on-scroll opacity-0 translate-y-10 transition-all duration-1000"
                       style="transition-delay: ${index * 200}ms;">
                    <div class="glass-effect rounded-2xl p-8 h-full hover:transform hover:scale-105 transition-all duration-300 neon-border group cursor-pointer">
                      <div class="text-4xl text-blue-400 mb-6 group-hover:text-blue-300 transition-colors">${feature.icon}</div>
                      <h3 class="text-xl font-light mb-4 tracking-wider">${feature.title}</h3>
                      <p class="text-gray-400 font-light leading-relaxed">${feature.description}</p>
                      
                      <div class="mt-6 h-1 bg-gradient-to-r ${feature.gradient} rounded-full transform scale-x-0 group-hover:scale-x-100 transition-transform duration-500"></div>
                    </div>
                  </div>
                `).join('')}
              </div>
            </div>
          </section>
        `;
      }
    }

    // Timeline Editor Component
    class TimelineEditor {
      static render(): string {
        const timeline: Timeline[] = [
          { frame: '00:00', effect: 'GLITCH', duration: '2.3s' },
          { frame: '00:02', effect: 'NEON', duration: '1.8s' },
          { frame: '00:04', effect: 'HOLO', duration: '3.1s' },
          { frame: '00:07', effect: 'VOID', duration: '2.7s' },
          { frame: '00:10', effect: 'FLUX', duration: '1.5s' },
        ];

        return `
          <section id="editor" class="py-32 px-6 relative">
            <div class="max-w-7xl mx-auto">
              <h2 class="text-5xl font-thin text-center mb-20" style="font-weight: 100;">
                FUTURISTIC <span class="text-blue-400">TIMELINE</span>
              </h2>
              
              <div class="glass-effect rounded-2xl p-8 neon-border">
                <div class="flex items-center justify-between mb-8">
                  <div class="flex items-center space-x-4">
                    <div class="w-3 h-3 rounded-full bg-red-500/50"></div>
                    <div class="w-3 h-3 rounded-full bg-yellow-500/50"></div>
                    <div class="w-3 h-3 rounded-full bg-green-500/50"></div>
                  </div>
                  <span class="text-sm text-gray-400 tracking-widest">PROJECT: UNTITLED_01</span>
                </div>
                
                <div class="relative">
                  <div class="h-2 bg-gradient-to-r from-blue-900 to-blue-600 rounded-full mb-4"></div>
                  
                  <div class="flex justify-between mt-8">
                    ${timeline.map((item, index) => `
                      <div class="animate-on-scroll opacity-0 translate-y-10 transition-all duration-1000"
                           style="transition-delay: ${index * 100}ms;">
                        <div class="timeline-dot w-4 h-4 rounded-full mx-auto mb-2"></div>
                        <div class="text-xs text-gray-400 text-center font-light">${item.frame}</div>
                        <div class="text-xs text-blue-400 text-center font-light">${item.effect}</div>
                        <div class="text-xs text-gray-500 text-center font-light">${item.duration}</div>
                      </div>
                    `).join('')}
                  </div>
                </div>
                
                <div class="mt-12 flex justify-center space-x-4">
                  <button class="glass-effect px-8 py-3 rounded-full text-sm uppercase tracking-widest hover:bg-blue-600 transition-all duration-300"
                          style="font-weight: 300;">▶ PLAY</button>
                  <button class="glass-effect px-8 py-3 rounded-full text-sm uppercase tracking-widest hover:bg-blue-600 transition-all duration-300"
                          style="font-weight: 300;">■ STOP</button>
                  <button class="glass-effect px-8 py-3 rounded-full text-sm uppercase tracking-widest hover:bg-blue-600 transition-all duration-300"
                          style="font-weight: 300;">⏸ PAUSE</button>
                </div>
              </div>
            </div>
          </section>
        `;
      }
    }

    // Projects Component
    class Projects {
      static render(): string {
        const projects: Project[] = [
          { title: 'NEON DREAMS', type: 'Music Video', color: 'blue' },
          { title: 'VOID WALKER', type: 'Short Film', color: 'purple' },
          { title: 'QUANTUM LEAP', type: 'Commercial', color: 'cyan' },
        ];

        return `
          <section id="projects" class="py-32 px-6">
            <div class="max-w-7xl mx-auto">
              <h2 class="text-5xl font-thin text-center mb-20" style="font-weight: 100;">
                FEATURED <span class="text-blue-400">PROJECTS</span>
              </h2>
              
              <div class="grid md:grid-cols-3 gap-8">
                ${projects.map((project, index) => `
                  <div class="animate-on-scroll opacity-0 translate-y-10 transition-all duration-1000 group cursor-pointer"
                       style="transition-delay: ${index * 150}ms;">
                    <div class="glass-effect rounded-2xl overflow-hidden neon-border hover:transform hover:scale-105 transition-all duration-500">
                      <div class="h-48 bg-gradient-to-br from-${project.color}-900/50 to-${project.color}-700/30 flex items-center justify-center">
                        <span class="text-6xl opacity-30">▶</span>
                      </div>
                      <div class="p-6">
                        <h3 class="text-lg font-light tracking-wider mb-2">${project.title}</h3>
                        <p class="text-sm text-gray-400 font-light">${project.type}</p>
                        <div class="mt-4 flex justify-between items-center">
                          <span class="text-xs text-blue-400">VIEW PROJECT →</span>
                          <span class="text-xs text-gray-500">4K • HDR</span>
                        </div>
                      </div>
                    </div>
                  </div>
                `).join('')}
              </div>
            </div>
          </section>
        `;
      }
    }

    // Footer Component
    class Footer {
      static render(): string {
        return `
          <footer class="border-t border-blue-500/10 py-12 px-6">
            <div class="max-w-7xl mx-auto">
              <div class="grid md:grid-cols-4 gap-8">
                <div>
                  <div class="flex items-center space-x-2 mb-4">
                    <div class="w-6 h-6 bg-gradient-to-r from-blue-500 to-blue-700 rounded transform rotate-45"></div>
                    <span class="text-lg font-thin tracking-widest glow-text">
                      ACTIVE <span class="text-blue-400">SUREPLUG</span>
                    </span>
                  </div>
                  <p class="text-xs text-gray-500 font-light leading-relaxed">
                    The future of video editing. Powered by quantum computing and artificial intelligence.
                  </p>
                </div>
                
                <div>
                  <h4 class="text-sm font-light text-blue-400 mb-4 tracking-wider">PRODUCT</h4>
                  <div class="space-y-2 text-xs text-gray-400 font-light">
                    <p>Features</p>
                    <p>Pricing</p>
                    <p>Download</p>
                    <p>Changelog</p>
                  </div>
                </div>
                
                <div>
                  <h4 class="text-sm font-light text-blue-400 mb-4 tracking-wider">COMPANY</h4>
                  <div class="space-y-2 text-xs text-gray-400 font-light">
                    <p>About</p>
                    <p>Blog</p>
                    <p>Careers</p>
                    <p>Contact</p>
                  </div>
                </div>
                
                <div>
                  <h4 class="text-sm font-light text-blue-400 mb-4 tracking-wider">CONNECT</h4>
                  <div class="space-y-2 text-xs text-gray-400 font-light">
                    <p>Twitter</p>
                    <p>Instagram</p>
                    <p>YouTube</p>
                    <p>Discord</p>
                  </div>
                </div>
              </div>
              
              <div class="mt-12 pt-8 border-t border-blue-500/10 text-center">
                <p class="text-xs text-gray-600 font-light tracking-wider">
                  © 2025 ACTIVE SUREPLUG. POWERED BY QUANTUM TECHNOLOGY.
                </p>
              </div>
            </div>
          </footer>
        `;
      }
    }

    // Initialize the app
    new App();
  </script>
</body>
</html>
